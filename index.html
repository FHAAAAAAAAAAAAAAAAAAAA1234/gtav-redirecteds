
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA V | Los Santos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  color: white;
  background: #080b09;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  text-align: center;
  overflow: hidden;
  background:
    linear-gradient(0deg, #080b09 0%, #080b0960 65%, #080b09aa 100%),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1800&q=85")
    center / cover no-repeat;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 25px 7%;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

header span {
  color: #a5ef42;
}

main {
  padding: 60px 20px 90px;
}

h1 {
  font-size: clamp(60px, 12vw, 125px);
  font-weight: 1000;
  letter-spacing: -5px;
  text-shadow: 0 5px 15px #000;
}

h1 span {
  color: #a5ef42;
}

h2 {
  margin-top: 5px;
  letter-spacing: 8px;
  font-size: clamp(16px, 3vw, 24px);
}

.line {
  width: 90px;
  height: 4px;
  background: #a5ef42;
  margin: 28px auto;
  box-shadow: 0 0 20px #a5ef42;
}

p {
  max-width: 550px;
  margin: auto;
  color: #ddd;
  line-height: 1.8;
  font-size: 15px;
}

.buttons {
  margin-top: 32px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 16px 28px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
  letter-spacing: 1px;
  transition: .25s;
}

.play {
  color: #10140c;
  background: #a5ef42;
}

.play:hover {
  background: #c5ff78;
  transform: translateY(-4px);
  box-shadow: 0 0 30px #a5ef4277;
}

.enter {
  color: white;
  border: 1px solid #ffffff80;
  background: #ffffff0b;
}

.enter:hover {
  color: #a5ef42;
  border-color: #a5ef42;
}

.message {
  margin-top: 28px;
  color: #b7c0b4;
  font-size: 11px;
  letter-spacing: 1px;
}

footer {
  padding: 18px;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1px;
  line-height: 1.8;
}

@media(max-width: 500px) {
  header {
    padding: 20px 5%;
    font-size: 10px;
  }

  h1 {
    letter-spacing: -3px;
  }

  h2 {
    letter-spacing: 4px;
  }

  .btn {
    width: 100%;
    max-width: 300px;
  }
}
</style>
</head>

<body>
<div class="hero">

<header>
  <div>OPEN WORLD <span>GAMING</span></div>
  <div>LOS SANTOS</div>
</header>

<main>
  <h1>GTA <span>V</span></h1>
  <h2>WELCOME TO LOS SANTOS</h2>

  <div class="line"></div>

  <p>
    The city is waiting. Explore the world, discover
    new adventures and enter your next gaming experience.
  </p>

  <div class="buttons">
    <a class="btn play"
       href="https://fiveplay.lol/">
       ▶ &nbsp; PLAY GTA V
    </a>

    <a class="btn enter"
       href="https://fiveplay.lol/">
       ENTER LOS SANTOS ↗
    </a>
  </div>

  <div class="message">
    CLICK A BUTTON TO CONTINUE TO FIVEPLAY
  </div>
</main>

<footer>
  FAN-MADE WEBSITE • NOT AFFILIATED WITH ROCKSTAR GAMES
</footer>

</div>
</body>
</html>
